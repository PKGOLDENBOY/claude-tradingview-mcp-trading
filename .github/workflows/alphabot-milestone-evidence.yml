name: AlphaBot milestone evidence (offline only)
on:
  push:
    branches: [research/completion-evidence-gate-20261029-v1]
    paths:
      - 'reports/alphabot-milestone-incomplete-20261031.json'
      - 'reports/alphabot-final-readiness-evidence-20261031.md'
      - 'lib/milestone-evidence-gate.mjs'
      - 'test/milestone-evidence-gate.test.mjs'
      - 'scripts/check-milestone-evidence.mjs'
      - '.github/workflows/alphabot-milestone-evidence.yml'
  pull_request:
    paths:
      - 'lib/milestone-evidence-gate.mjs'
      - 'test/milestone-evidence-gate.test.mjs'
      - 'test/paper-ledger-evidence.test.mjs'
      - 'scripts/check-milestone-evidence.mjs'
      - 'reports/alphabot-milestone-incomplete-20261029.json'
      - 'reports/alphabot-milestone-incomplete-20261031.json'
      - 'reports/alphabot-final-readiness-evidence-20261031.md'
      - '.github/workflows/alphabot-milestone-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted research branch (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check lib/milestone-evidence-gate.mjs
          node --check scripts/check-milestone-evidence.mjs
      - name: Run only deterministic offline regressions
        run: node --test test/milestone-evidence-gate.test.mjs test/paper-ledger-evidence.test.mjs
      - name: Confirm snapshot is NOT incorrectly called complete
        run: |
          node scripts/check-milestone-evidence.mjs reports/alphabot-milestone-incomplete-20261029.json
          node scripts/check-milestone-evidence.mjs reports/alphabot-milestone-incomplete-20261031.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {inspectMilestoneEvidence} from './lib/milestone-evidence-gate.mjs';
          for(const day of ['20261029','20261031']) {
            const snapshot=JSON.parse(fs.readFileSync('reports/alphabot-milestone-incomplete-'+day+'.json','utf8'));
            const report=inspectMilestoneEvidence(snapshot);
            assert.equal(snapshot.status,'INCOMPLETE');
            assert.equal(snapshot.profitabilityDemonstrated,false);
            assert.equal(report.structuralEvidencePresent,false);
            assert.equal(report.notificationAuthorized,false);
            assert.equal(report.profitabilityDemonstrated,false);
            assert.ok(report.missing.length > 0);
          }
          console.log('BOTH_DATED_SNAPSHOTS_FAIL_CLOSED_NO_MILESTONE_NOTIFICATION');
          EOF
