name: AlphaBot market universe research tests

on:
  push:
    branches:
      - research/ten-year-market-universe-20261027
  pull_request:
    paths:
      - 'research/**'
      - 'test/market-universe-history.test.mjs'
      - 'test/historical-backfill.test.mjs'
      - 'scripts/research-history-pilot.mjs'
      - '.github/workflows/market-universe-research.yml'

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public-only market universe planner tests
        run: node --test test/market-universe-history.test.mjs test/historical-backfill.test.mjs
      - name: Syntax-check offline modules
        run: |
          node --check research/market-universe-history.js
          node --check research/historical-backfill.js
          node --check scripts/research-history-pilot.mjs
          node --check research/market-discovery.js
          node --check scripts/research-market-discovery.mjs

  public-api-smoke:
    name: Read-only Bitget single-page live API pilot
    needs: offline-unit-tests
    if: github.event_name == 'pull_request' && github.head_ref == 'research/ten-year-market-universe-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hard-capped public GET pilot; no secrets or orders
        run: |
          node scripts/research-history-pilot.mjs \
            --output-dir=research-data/history-pilot \
            --max-markets=1 \
            --max-new-pages=1 \
            --max-storage-bytes=1000000 \
            --max-runtime-seconds=90 \
            --lookback-days=14 \
            --min-delay-ms=500
      - name: Probe oldest planned BTC historical window (not an availability guarantee)
        run: |
          node scripts/research-history-pilot.mjs \
            --output-dir=research-data/history-age-probe \
            --max-markets=1 \
            --max-new-pages=1 \
            --max-storage-bytes=1000000 \
            --max-runtime-seconds=90 \
            --lookback-days=3653 \
            --min-delay-ms=500
      - name: Probe separate liquid-altcoin batch from the same frozen inventory
        run: |
          node scripts/research-history-pilot.mjs \
            --inventory-file=research-data/history-pilot/market-inventory.json \
            --output-dir=research-data/history-altcoin-probe \
            --market-offset=10 \
            --max-markets=1 \
            --max-new-pages=1 \
            --max-storage-bytes=1000000 \
            --max-runtime-seconds=90 \
            --lookback-days=14 \
            --min-delay-ms=500
      - name: Probe a lower-turnover market from the same frozen inventory
        run: |
          node scripts/research-history-pilot.mjs \
            --inventory-file=research-data/history-pilot/market-inventory.json \
            --output-dir=research-data/history-altcoin-midprobe \
            --market-offset=200 \
            --max-markets=1 \
            --max-new-pages=1 \
            --max-storage-bytes=1000000 \
            --max-runtime-seconds=90 \
            --lookback-days=14 \
            --min-delay-ms=500
      - name: Save immutable pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-get-only-history-pilot
          path: research-data/
          retention-days: 7
          if-no-files-found: warn
