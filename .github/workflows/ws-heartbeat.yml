name: BitGet websocket heartbeat safety
on:
  push:
    branches: [fix/bitget-ws-heartbeat-20261019]
    paths:
      - 'bot.js'
      - 'lib/bitget-ws-heartbeat.mjs'
      - 'test/heartbeat.test.mjs'
      - 'test/ws-smoke.mjs'
      - '.github/workflows/ws-heartbeat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and regression tests
        run: |
          node --check bot.js
          node --check lib/bitget-ws-heartbeat.mjs
          node --test test/*.test.mjs
      - name: Check known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Verify literal ping/pong with BitGet public socket
        run: node test/ws-smoke.mjs
