name: Long-term adaptive paper-only safety CI
on:
  push:
    branches: [test/alphabot-lt-balanced-adaptive-20261022]
    paths:
      - .github/workflows/longterm-paper-integration.yml
      - bot.js
      - lib/longterm-shadow-engine.mjs
      - lib/longterm-adaptive-policy.mjs
      - test/longterm-paper-integration.test.mjs
      - test/longterm-adaptive-policy.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PAPER_TRADING: "true"
      LIVE_TRADING_ENABLED: "false"
      LIVE_TRADING_APPROVED: "false"
      LT_PAPER_SHADOW_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and paper-only integration regression suite
        run: |
          node --check bot.js
          node --check lib/longterm-adaptive-policy.mjs
          node --check lib/longterm-shadow-engine.mjs
          node --test test/longterm-paper-integration.test.mjs test/longterm-shadow.test.mjs test/longterm-adaptive-policy.test.mjs
