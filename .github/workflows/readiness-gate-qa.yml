name: AlphaBot NO-GO readiness diagnostic (offline)
on:
  push:
    branches:
      - research/nov08-readiness-diagnostics
  pull_request:
    branches:
      - research/parallel-accelerator-20261025
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PAPER_TRADING: 'true'
      LIVE_TRADING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lib/readiness-diagnostic.mjs
      - run: node --check lib/forward-paper-evidence.mjs
      - run: node --test test/accelerator-readiness.test.mjs test/accelerator-forward-evidence.test.mjs
